[package]
name = "app"
version = "0.1.2"
description = "Open-source desktop AI client"
authors = ["JeffreyJYZ"]
license = "GPL-3.0-only"
repository = "https://github.com/JeffreyJYZ/ai-client-oss"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# In-app updates. Pinned to the v2 line (tauri 2.12.x); crates.io `latest`
# is the 3.0.0 alpha, which pairs with tauri 3, not this app.
tauri-plugin-updater = "=2.13.2"
# `relaunch` for the JS side after an update installs.
tauri-plugin-process = "=2.4.0"
