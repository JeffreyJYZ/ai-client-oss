name: Release — desktop

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Bump version, commit and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun scripts/bump-version.ts ${{ inputs.bump }} | tail -n1)"
          tag="desktop-v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `web/src/docs/reference.generated.ts` pins `appVersion` to
          # `web/package.json` (reference.test.ts), so a bump that skips this
          # leaves the default branch red and fails CI on the bump commit.
          (cd web && bun run docs)
          git add web/package.json web/src-tauri/tauri.conf.json web/src-tauri/Cargo.toml web/src-tauri/Cargo.lock web/src/docs/reference.generated.ts
          git commit -m "chore(release): desktop v${version}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag "${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rustTargets: ""
          - platform: windows-latest
            args: ""
            rustTargets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}

      - name: Install Linux dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Resolve and verify the release version
        id: release
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#desktop-v}"
          got="$(node -p "require('./web/src-tauri/tauri.conf.json').version")"
          if [ "$version" != "$got" ]; then
            echo "tag version '${version}' does not match tauri.conf.json version '${got}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. `bundle.createUpdaterArtifacts` is on, so the
          # bundler only emits the `.tar.gz`/`.zip` + `.sig` pair and the
          # updater `latest.json` when these are present. The repo secrets
          # hold the private key content and its password — never print or
          # commit either, and never rotate the key: the public key baked
          # into shipped binaries is what verifies the download, so a new
          # keypair orphans every installed app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri's dmg bundler runs a Finder AppleScript to prettify the window,
          # which hangs/fails without a GUI+Automation session. `CI` makes it skip
          # that step. Runners export CI=true already; pinned here so the release
          # never depends on that default.
          CI: "true"
        with:
          projectPath: web
          tauriScript: bun run tauri
          tagName: ${{ needs.version.outputs.tag || github.ref_name }}
          releaseName: Open Source AI Client ${{ steps.release.outputs.version }}
          releaseBody: |
            Download the installer for your platform from the assets below.

            **New in 0.6.1**

            - **The app ships working plugin examples.** Settings → Plugins → **Examples** lists eight, and one click installs the manifest and code into your own plugins. They are full-trust code like any other, and stay off until you enable the master switch.
            - **Four new examples** cover the surfaces that had none: a view that owns the whole window (`zen-view`), a sidebar panel with real storage (`sidebar-notes`), three pipeline stages (`history-pipeline`), and a markdown renderer override with a safe fallback (`markdown-callouts`).
            - **The examples are checked by the build.** They are typechecked with the app, and a test runs each one's `setup` and pins what it registers, so an example cannot drift from the API it teaches.

            **New in 0.6.0**

            - **Chats name themselves.** The first message a new conversation gets is handed to a free model, which returns a short title, so the sidebar stops showing the raw first line forever.
            - **You choose who titles.** Settings → Titler picks a provider and model, or leaves it on **Automatic**: the automatic rule only ever uses a free model, and it reads that id from the provider's own fetched model list, so a stale hardcoded id can no longer silently dead-end.
            - **A rename always wins.** The titler never overwrites a name you typed, and it never touches a conversation that already has a title. Deleting a conversation mid-flight writes nothing.
            - **The row is honest.** It names the model that will title your chats and warns that the first message goes to *that* provider, which may differ from your chat's. When nothing resolves it says so and names the remedy — Fetch models, or pick a model. Switching the Built-ins → Titler area off removes the row, the naming and its background work together.

            **New in 0.5.0**

            - **Memory is a built-in area.** The model records a durable note when a conversation teaches it something, and Settings lists, edits and soft-deletes them, with a Recently deleted list to restore from.
            - **Every built-in area can be switched off**, and its UI, its tools and its background work go with it.

            **New in 0.4.0**

            - **Plugins.** Plugins can add views, tools, slash commands and settings rows; the built-in areas are themselves plugins you can toggle in Built-ins.

            **License:** this version is GPL-3.0-only. The 0.1.x releases were MIT and stay MIT for anyone who already has them.

            **macOS**: open the `.dmg`, drag the app into Applications, then clear the download quarantine flag. These builds are unsigned and not notarized, and **right-click → Open no longer bypasses Gatekeeper** on current macOS:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/oss-ai-client.app"
            ```

            Add `sudo` if it reports a permission error, and change the path if the app is installed elsewhere.

            **Windows**: run the `-setup.exe` (or the `.msi`). These builds are unsigned, so SmartScreen may warn: choose **More info → Run anyway**.
            **Linux**: install the `.deb` / `.rpm`, or `chmod +x` the `.AppImage` and run it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Repins the Homebrew cask as soon as the release exists. The tap is a
  # separate repository, so this is the one cross-repo hop in the pipeline and
  # it needs its own credential: a fine-grained PAT in `TAP_DISPATCH_TOKEN`
  # (Contents: write, scoped to `JeffreyJYZ/homebrew-tap` only). It is
  # **optional** — with no secret the step says so and exits 0, and the tap's
  # own daily run still catches up.
  tap:
    needs: [version, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the cask repin
        env:
          TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "TAP_DISPATCH_TOKEN is unset; the tap repins on its own schedule"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/JeffreyJYZ/homebrew-tap/dispatches \
            -d '{"event_type":"client-release"}'
          echo "dispatched client-release to JeffreyJYZ/homebrew-tap"
