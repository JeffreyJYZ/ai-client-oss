name: Release — desktop

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Bump version, commit and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun scripts/bump-version.ts ${{ inputs.bump }} | tail -n1)"
          tag="desktop-v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/src-tauri/tauri.conf.json web/src-tauri/Cargo.toml web/src-tauri/Cargo.lock
          git commit -m "chore(release): desktop ${tag}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag "${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rustTargets: ""
          - platform: windows-latest
            args: ""
            rustTargets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}

      - name: Install Linux dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Resolve and verify the release version
        id: release
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#desktop-v}"
          got="$(node -p "require('./web/src-tauri/tauri.conf.json').version")"
          if [ "$version" != "$got" ]; then
            echo "tag version '${version}' does not match tauri.conf.json version '${got}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri's dmg bundler runs a Finder AppleScript to prettify the window,
          # which hangs/fails without a GUI+Automation session. `CI` makes it skip
          # that step. Runners export CI=true already; pinned here so the release
          # never depends on that default.
          CI: "true"
        with:
          projectPath: web
          tauriScript: bun run tauri
          tagName: ${{ needs.version.outputs.tag || github.ref_name }}
          releaseName: Open Source AI Client ${{ steps.release.outputs.version }}
          releaseBody: |
            Download the installer for your platform.

            macOS builds are unsigned — right-click → Open the first time.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
