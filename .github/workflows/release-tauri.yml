name: Release — desktop

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Bump version, commit and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun scripts/bump-version.ts ${{ inputs.bump }} | tail -n1)"
          tag="desktop-v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/src-tauri/tauri.conf.json web/src-tauri/Cargo.toml web/src-tauri/Cargo.lock
          git commit -m "chore(release): desktop v${version}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag "${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rustTargets: ""
          - platform: windows-latest
            args: ""
            rustTargets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}

      - name: Install Linux dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Resolve and verify the release version
        id: release
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#desktop-v}"
          got="$(node -p "require('./web/src-tauri/tauri.conf.json').version")"
          if [ "$version" != "$got" ]; then
            echo "tag version '${version}' does not match tauri.conf.json version '${got}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. `bundle.createUpdaterArtifacts` is on, so the
          # bundler only emits the `.tar.gz`/`.zip` + `.sig` pair and the
          # updater `latest.json` when these are present. The repo secrets
          # hold the private key content and its password — never print or
          # commit either, and never rotate the key: the public key baked
          # into shipped binaries is what verifies the download, so a new
          # keypair orphans every installed app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri's dmg bundler runs a Finder AppleScript to prettify the window,
          # which hangs/fails without a GUI+Automation session. `CI` makes it skip
          # that step. Runners export CI=true already; pinned here so the release
          # never depends on that default.
          CI: "true"
        with:
          projectPath: web
          tauriScript: bun run tauri
          tagName: ${{ needs.version.outputs.tag || github.ref_name }}
          releaseName: Open Source AI Client ${{ steps.release.outputs.version }}
          releaseBody: |
            Download the installer for your platform from the assets below.

            **New in 0.2.3**

            - Settings folds the Memory section by default, so its list no longer pushes everything else down the page.

            **New in 0.2.2**

            - Settings has an **Updates** section. Check for a new version whenever you like and install it there, so dismissing the notice no longer hides the only way to update.
            - macOS installs with Homebrew: `brew trust jeffreyjyz/tap` once, then `brew install --cask jeffreyjyz/tap/oss-ai-client`.

            **Fixed in 0.2.1**

            - Settings heading controls work again. The memory toggle and the web search switch could not be clicked in 0.2.0.
            - A reloaded conversation keeps a turn's files and images, so a turn that was only an attachment no longer drops out of what the model sees.
            - The tools block folds like the other settings sections.

            **New in 0.2.0**

            - The model can read a page you link, and with a TinyFish key it reads script-rendered pages too.
            - Web search on endpoints that have none of their own, through TinyFish with your own API key. Local models included.
            - Thinking streams properly from OpenRouter's newer reasoning shape, with a live count while it thinks.
            - The model no longer forgets the conversation after a page reload or a failed request.
            - Settings sections fold, and controls in a heading row still do their job.
            - The app icon is inset on Apple's grid, so it no longer reads oversized in the Dock.

            **License:** this version is GPL-3.0-only. The 0.1.x releases were MIT and stay MIT for anyone who already has them.

            **macOS**: open the `.dmg`, drag the app into Applications, then clear the download quarantine flag. These builds are unsigned and not notarized, and **right-click → Open no longer bypasses Gatekeeper** on current macOS:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/oss-ai-client.app"
            ```

            Add `sudo` if it reports a permission error, and change the path if the app is installed elsewhere.

            **Windows**: run the `-setup.exe` (or the `.msi`). These builds are unsigned, so SmartScreen may warn: choose **More info → Run anyway**.
            **Linux**: install the `.deb` / `.rpm`, or `chmod +x` the `.AppImage` and run it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
