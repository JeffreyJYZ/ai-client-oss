name: Release — desktop

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Bump version, commit and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun scripts/bump-version.ts ${{ inputs.bump }} | tail -n1)"
          tag="desktop-v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `web/src/docs/reference.generated.ts` pins `appVersion` to
          # `web/package.json` (reference.test.ts), so a bump that skips this
          # leaves the default branch red and fails CI on the bump commit.
          (cd web && bun run docs)
          git add web/package.json web/src-tauri/tauri.conf.json web/src-tauri/Cargo.toml web/src-tauri/Cargo.lock web/src/docs/reference.generated.ts
          git commit -m "chore(release): desktop v${version}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag "${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      # One platform at a time. `tauri-action` checks for the release, then
      # creates it when missing — and with the matrix in parallel every job
      # races that check (measured on desktop-v0.6.3: Linux created the
      # release, Windows hit the gap and failed, and the still-queued macOS job
      # was cancelled with the run, leaving a Linux-only release). Serialising
      # costs minutes and makes each job see what the previous one created.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rustTargets: ""
          - platform: windows-latest
            args: ""
            rustTargets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}

      - name: Install Linux dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Resolve and verify the release version
        id: release
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#desktop-v}"
          got="$(node -p "require('./web/src-tauri/tauri.conf.json').version")"
          if [ "$version" != "$got" ]; then
            echo "tag version '${version}' does not match tauri.conf.json version '${got}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. `bundle.createUpdaterArtifacts` is on, so the
          # bundler only emits the `.tar.gz`/`.zip` + `.sig` pair and the
          # updater `latest.json` when these are present. The repo secrets
          # hold the private key content and its password — never print or
          # commit either, and never rotate the key: the public key baked
          # into shipped binaries is what verifies the download, so a new
          # keypair orphans every installed app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri's dmg bundler runs a Finder AppleScript to prettify the window,
          # which hangs/fails without a GUI+Automation session. `CI` makes it skip
          # that step. Runners export CI=true already; pinned here so the release
          # never depends on that default.
          CI: "true"
        with:
          projectPath: web
          tauriScript: bun run tauri
          tagName: ${{ needs.version.outputs.tag || github.ref_name }}
          releaseName: Open Source AI Client ${{ steps.release.outputs.version }}
          releaseBody: |
            Download the installer for your platform from the assets below.

            **New in 0.6.9**

            - **The desktop app now shows pairing as it happens.** Pair a browser tab with the local companion and the app's Settings says so within seconds — "Paired — https://aiclient.jyz.land is using this app right now." — instead of only updating on the next reload. The record is display-only; the token still decides every request.
            - **The settings rail stays visible.** The section list is sticky at every width and scrolls on its own when it outgrows the window, so jumping between sections no longer means scrolling back up to find the rail.
            - **Profiles bundle a variant.** A profile now carries a provider, model, system prompt **and** a variant, so one pick applies the whole configuration including generation parameters. New profiles start from the variant already in use, and a profile whose variant was deleted clears it rather than leaving a stale one.
            - **Provider fixes.** A streamed error now fails the turn instead of finishing with an empty reply; OpenRouter/Responses attachments are written in their real fields; a tool call that arrives beside empty content is kept; a stopped turn aborts cleanly.
            - **Security.** Conversation ids are validated, settings and conversation writes are atomic, and the local companion's surface is bounded by the exact origin list.

            **License:** this version is GPL-3.0-only. The 0.1.x releases were MIT and stay MIT for anyone who already has them.

            **macOS**: open the `.dmg`, drag the app into Applications, then clear the download quarantine flag. These builds are unsigned and not notarized, and **right-click → Open no longer bypasses Gatekeeper** on current macOS:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/oss-ai-client.app"
            ```

            Add `sudo` if it reports a permission error, and change the path if the app is installed elsewhere.

            **Windows**: run the `-setup.exe` (or the `.msi`). These builds are unsigned, so SmartScreen may warn: choose **More info → Run anyway**.
            **Linux**: install the `.deb` / `.rpm`, or `chmod +x` the `.AppImage` and run it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
