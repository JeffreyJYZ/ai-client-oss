name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Type-check
        working-directory: web
        run: bunx tsc -b --force
      - name: Lint
        working-directory: web
        run: bunx biome check .
      # The suite is the only gate on behaviour: the four steps around it check
      # types, formatting, effects and that the bundle builds. `bun run verify`
      # has always run it; CI composed its own list and left it out, so a PR
      # could delete an assertion or regress a parser and still merge green.
      - name: Test
        working-directory: web
        run: bun test
      - name: Effect language service diagnostics
        working-directory: web
        run: bunx effect-language-service diagnostics --project tsconfig.app.json --format text
      - name: Build
        working-directory: web
        run: bunx vite build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Cargo check
        working-directory: web/src-tauri
        run: cargo check --all-targets
      # `--all-targets` compiles the tests but never runs them; the shell's own
      # tests are what pin plugin path containment and the companion's guards.
      - name: Cargo test
        working-directory: web/src-tauri
        run: cargo test
